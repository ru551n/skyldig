services:
  skyldig-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyldig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyldig}
      POSTGRES_DB: ${POSTGRES_DB:-skyldig}
    volumes:
      - skyldig-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skyldig-internal
    restart: unless-stopped

  app:
    # Self-hosters run the published image. Pin a release with SKYLDIG_TAG (e.g.
    # SKYLDIG_TAG=v0.2.1) rather than tracking `latest`, if you prefer explicit
    # upgrades. To build from a source checkout instead, add the override:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d
    image: ru551n/skyldig:${SKYLDIG_TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-skyldig}:${POSTGRES_PASSWORD:-skyldig}@skyldig-db:5432/${POSTGRES_DB:-skyldig}
      PORT: ${PORT:-3000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ACCESS_KEY_PEPPER: ${ACCESS_KEY_PEPPER:?ACCESS_KEY_PEPPER must be set (min 32 chars) — export it or set it in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      skyldig-db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - skyldig-internal
      - skyldig-edge
    restart: unless-stopped

volumes:
  skyldig-pgdata:

networks:
  # Postgres attaches to this one only. `internal` gives it no gateway, so it has
  # no route off the host and is reachable only by the app container beside it.
  skyldig-internal:
    internal: true
  # The app additionally joins this one, which carries its published port and the
  # outbound calls the daily FX-rate lookup makes.
  skyldig-edge:
