# Developer override: build the app image from this checkout instead of pulling
# the published one. Usage:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  app:
    build: .
    image: skyldig:local
  # The setup tool ships in the same image, so it must use the local build too.
  skyldig-db-setup:
    build: .
    image: skyldig:local
